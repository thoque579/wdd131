<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>

    <div class="card">
        <img src="snortleblat.webp" alt="">
        <h1>snortleblat</h1>
        <p>Class: Swamp Beast Diplomat</p>
        <div class="stats">
            <p>level: <span id="level">0</span></p>
            <p>Health:&nbsp;<span id="health">100</span></p>
            <button class="attack">Attack</button>
            <button class="level_up">Level Up</button>
        </div>
    </div>

</body>
</html>
