<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

<!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

<!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>

<header>
  <img src="images/recipe-book.png" alt="Recipe Book logo">
  <h1>RecipeBook</h1>
</header>
<body>
     <main>
    <form class="search">
      <input type="search" placeholder="Find a recipe" aria-label="Find a recipe">
      <button type="submit" aria-label="Search">
        <img src="images/search.svg" alt="">
      </button>
    </form>

    <section class="recipe">
      <img class="recipe-image" src="images/apple-crisp.jpg" alt="Apple crisp with ice cream">

      <div class="recipe-content">
        <span class="category">dessert</span>
        <h2>Apple Crisp</h2>

        <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
          <span aria-hidden="true">⭐⭐⭐⭐☆</span>
        </span>

        <p class="description">
          This apple crisp recipe is a simple yet delicious fall
          dessert that's great served warm with vanilla ice cream.
        </p>
      </div>
    </section>
  </main>

  <footer>
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
      Recipe icons created by Freepik - Flaticon
    </a>

    <div class="social">
      <a href="#"><img src="images/instagram_icon.svg" alt="Instagram"></a>
      <a href="#"><img src="images/youtube_icon.svg" alt="YouTube"></a>
      <a href="#"><img src="images/pinterest_icon.svg" alt="Pinterest"></a>
    </div>
  </footer>
    
</body>
</html>
